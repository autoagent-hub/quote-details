<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="8" />

  <!-- Car Silhouette Icon -->
  <g transform="translate(48, 70)">
    <!-- Sleek Car Top / Roof -->
    <path d="M 100 230 C 130 160, 200 130, 290 130 C 350 130, 380 160, 400 230 Z" fill="none" stroke="url(#carGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Car Body Line -->
    <path d="M 40 260 L 420 260 C 440 260, 450 270, 450 290 L 440 315 C 435 325, 425 330, 410 330 L 50 330 C 35 330, 25 325, 20 315 L 10 290 C 10 270, 20 260, 40 260 Z" fill="url(#carGrad)" />

    <!-- Headlight Sparkle -->
    <path d="M 410 275 L 435 285 L 410 295 Z" fill="#38bdf8" />

    <!-- Wheels -->
    <circle cx="110" cy="330" r="38" fill="#0f172a" stroke="#ffffff" stroke-width="12" />
    <circle cx="110" cy="330" r="14" fill="#38bdf8" />

    <circle cx="350" cy="330" r="38" fill="#0f172a" stroke="#ffffff" stroke-width="12" />
    <circle cx="350" cy="330" r="14" fill="#38bdf8" />

    <!-- Detailing Polish Shine Star (Top Right) -->
    <g transform="translate(360, 60)">
      <path d="M 40 0 L 48 30 L 80 40 L 48 50 L 40 80 L 32 50 L 0 40 L 32 30 Z" fill="url(#shineGrad)" />
      <circle cx="40" cy="40" r="8" fill="#ffffff" />
    </g>

    <g transform="translate(100, 40)">
      <path d="M 20 0 L 24 15 L 40 20 L 24 25 L 20 40 L 16 25 L 0 20 L 16 15 Z" fill="url(#shineGrad)" opacity="0.8"/>
    </g>
  </g>
</svg>
